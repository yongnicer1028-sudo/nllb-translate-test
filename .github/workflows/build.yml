name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────
# 커밋을 연달아 여러 개 올리면(예: 파일 두 개를 이어서 커밋) 이 빌드가 동시에
# 여러 번 겹쳐서 실행될 수 있어요. 그러면 두 빌드가 동시에 "서명키 캐시가
# 아직 비어있네?" 라고 착각하고 각자 다른(무작위) 서명키를 만들어버리는
# 사고가 날 수 있었어요 — 이러면 나중에 폰에 설치할 때 "서명이 달라서
# 업데이트 실패, 삭제 후 재설치 필요" 오류가 나요. concurrency로 항상
# 한 번에 하나씩만 실행되게 막아서 이 사고 자체를 막아요.
# ─────────────────────────────────────────────────────────────────────────
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 디버그 서명키 캐시 (매번 같은 키로 서명되게 해서 업데이트가 정상적으로 되게 함)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 자바(JDK 17) 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 디버그 키스토어 없으면 새로 만들기 (캐시가 비어있을 때 최초 1회만 실행됨)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi

      - name: 그레이들(Gradle) 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 안드로이드 SDK 라이선스 동의
        run: yes | ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 디버그 APK 빌드
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK 업로드 (백업용, 압축파일)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 압축 없이 바로 받는 링크 만들기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: 최신 테스트용 APK (자동 갱신됨)
          body: 이 링크의 app-debug.apk 파일을 누르면 압축 풀 필요 없이 바로 설치할 수 있어요.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
