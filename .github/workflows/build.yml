name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────
# 커밋을 연달아 여러 개 올리면(예: 파일 두 개를 이어서 커밋) 이 빌드가 동시에
# 여러 번 겹쳐서 실행될 수 있어요. 그러면 두 빌드가 동시에 "서명키 캐시가
# 아직 비어있네?" 라고 착각하고 각자 다른(무작위) 서명키를 만들어버리는
# 사고가 날 수 있었어요 — 이러면 나중에 폰에 설치할 때 "서명이 달라서
# 업데이트 실패, 삭제 후 재설치 필요" 오류가 나요. concurrency로 항상
# 한 번에 하나씩만 실행되게 막아서 이 사고 자체를 막아요.
# ─────────────────────────────────────────────────────────────────────────
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 자바(JDK 17) 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 저장소에 고정해둔 디버그 서명키 그대로 사용 (항상 똑같은 키라서 업데이트가 안 깨짐)
        # ⚠️ 예전엔 "깃허브 액션 캐시에 서명키가 있으면 재사용, 없으면 새로
        # 랜덤 생성" 방식이었는데, 그 캐시가 며칠 안 쓰면 자동으로 지워질 수
        # 있고, 빌드가 동시에 두 개 실행되면 서로 다른 키를 만들 수도 있어서
        # 가끔 서명키가 바뀌어버렸어요 (그러면 폰에서 "업데이트 실패, 기존
        # 앱을 지우고 새로 설치해야 함" 오류가 나요). 그래서 이제는 저장소
        # 안에 서명키 파일을 아예 고정해서 넣어두고(keystore/debug.keystore),
        # 매번 그 파일을 그대로 복사해서 써요. 이러면 어떤 상황에서도 서명키가
        # 절대 안 바뀌어서, 이 문제가 다시는 안 생겨요.
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: 그레이들(Gradle) 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 안드로이드 SDK 라이선스 동의
        run: yes | ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 디버그 APK 빌드
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK 업로드 (백업용, 압축파일)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 압축 없이 바로 받는 링크 만들기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: 최신 테스트용 APK (자동 갱신됨)
          body: 이 링크의 app-debug.apk 파일을 누르면 압축 풀 필요 없이 바로 설치할 수 있어요.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
