name: Tokenizer Check

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'tokenizer-check/**'
      - '.github/workflows/tokenizer-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: run tokenizer check (scans merges and writes tokenizer.fixed.json if needed)
        run: gradle :tokenizer-check:run --no-daemon --stacktrace

      - name: 고쳐진 tokenizer.json이 만들어졌으면 릴리즈용 이름으로 복사하기
        id: prep_fixed
        run: |
          if [ -f tokenizer-check/tokenizer.fixed.json ]; then
            cp tokenizer-check/tokenizer.fixed.json tokenizer-check/tokenizer.json
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 고쳐진 tokenizer.json을 안정적인 GitHub Release 주소로 올리기
        if: steps.prep_fixed.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tokenizer-fixed-m2m100
          name: 고쳐진 tokenizer.json (M2M100 번역용, merge 오류 수정판)
          body: |
            huggingface.co의 Xenova/m2m100_418M 저장소에 있는 tokenizer.json 파일
            자체에 버그가 있어서 (merge 규칙 231,277개 중 1,053개가 vocab에 없는
            결과를 만드는 이상한 규칙이라, 안드로이드에서도 컴퓨터에서도 무조건
            "Token out of vocabulary" 오류로 실패함), 그 1,053개를 제거해서
            정상적으로 불러와지게 고친 파일이에요.
            앱은 이제 huggingface.co 대신 이 파일을 받아서 써요.
          files: tokenizer-check/tokenizer.json
          prerelease: true
