name: Tokenizer Check

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'tokenizer-check/**'
      - '.github/workflows/tokenizer-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: run tokenizer check
        run: gradle :tokenizer-check:run --no-daemon --stacktrace
