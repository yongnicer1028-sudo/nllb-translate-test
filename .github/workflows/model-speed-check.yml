name: Model Speed Check

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'model-speed-check/**'
      - '.github/workflows/model-speed-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: M2M100 vs NLLB-200 속도/용량/품질 비교 실행 (둘 다 실제 모델로)
        run: gradle :model-speed-check:run --no-daemon --stacktrace
